  VERNIER-10 — Drop-in Custom HTML Skin Snippet for Video.js v10
  License: Apache-2.0
  Requires: ./vernier-skin.css, ./vernier-skin.js, and @videojs/cdn@10.5.0
-->
<!-- auteur-allow: VIDEO_NO_POSTER -- <video-player> is a boxless Video.js v10 state provider; poster is authored on inner <mux-video> and <media-poster> -->
<video-player class="vernier-player" id="vjs-player">
  <media-container class="vernier-stage is-paused is-pristine" id="vjs-stage" data-vernier-polarity="obsidian">
    <!-- Primary Mux Adaptive HLS Stream (swappable via loadSource to MP4 / Blob / Playback ID) -->
    <mux-video
      id="vjs-media"
      src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM.m3u8"
      poster="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/thumbnail.webp?time=2"
      playsinline
      preload="metadata"
      crossorigin="anonymous"
    ></mux-video>

    <!-- Poster Frame (instant LCP before decode) -->
    <media-poster class="vernier-poster">
      <img
        src="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/thumbnail.webp?time=2"
        alt="Video preview frame"
        decoding="async"
      />
    </media-poster>

    <!-- Pointer Gestures -->
    <media-gesture class="vernier-gesture" type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
    <media-gesture class="vernier-gesture" type="doubletap" action="seekStep" value="-10" region="left"></media-gesture>
    <media-gesture class="vernier-gesture" type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
    <media-gesture class="vernier-gesture" type="doubletap" action="seekStep" value="10" region="right"></media-gesture>

    <!-- Keyboard Shortcuts -->
    <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
    <media-hotkey keys="k" action="togglePaused"></media-hotkey>
    <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
    <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
    <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
    <media-hotkey keys="ArrowLeft" action="seekStep" value="-5"></media-hotkey>
    <media-hotkey keys="ArrowRight" action="seekStep" value="5"></media-hotkey>
    <media-hotkey keys="j" action="seekStep" value="-10"></media-hotkey>
    <media-hotkey keys="l" action="seekStep" value="10"></media-hotkey>
    <media-hotkey keys="ArrowUp" action="volumeStep" value="0.05"></media-hotkey>
    <media-hotkey keys="ArrowDown" action="volumeStep" value="-0.05"></media-hotkey>
    <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>

    <!-- Accessible Status Live Region -->
    <media-status-announcer class="vernier-status-announcer"></media-status-announcer>

    <div class="vernier-scrim" aria-hidden="true"></div>

    <!-- Optical Viewfinder Corner Reticles -->
    <div class="vernier-reticles" aria-hidden="true">
      <span class="vernier-reticle tl"></span>
      <span class="vernier-reticle tr"></span>
      <span class="vernier-reticle bl"></span>
      <span class="vernier-reticle br"></span>
    </div>

    <!-- Top Transport Tally HUD -->
    <div class="vernier-hud-top">
      <div class="vernier-tally-pill">
        <span class="vernier-tally-led" aria-hidden="true"></span>
        <span id="hud-state-text" class="vernier-tally-label">STANDBY</span>
      </div>
      <div class="vernier-stream-badge" id="hud-stream-badge">MUX HLS · STORYBOARD</div>
    </div>

    <!-- Center Optical Shutter Trigger -->
    <div class="vernier-center-aperture">
      <media-play-button class="vernier-aperture-btn" id="center-play-btn" aria-label="Play video" data-paused>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="7,4 20,12 7,20"></polygon>
        </svg>
      </media-play-button>
    </div>

    <!-- Optical Buffering Ring -->
    <media-buffering-indicator class="vernier-buffer" aria-label="Buffering">
      <span class="vernier-buffer-ring" aria-hidden="true"></span>
    </media-buffering-indicator>

    <!-- Bottom Vernier Control Deck -->
    <media-controls class="vernier-controls">
      <media-controls-backdrop></media-controls-backdrop>
      <media-controls-content class="vernier-controls-content" data-visible>
        <media-tooltip-group delay="450" close-delay="100" timeout="600">
          <div class="vernier-deck">
            <!-- Signature Peak: Millimeter-Graduated Vernier Scrub Rail -->
            <div class="vernier-rail-wrap">
              <media-time-slider
                class="vernier-slider"
                aria-label="Seek timeline"
                tabindex="0"
                role="slider"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <media-time-slider-chapters class="vernier-chapters">
                  <template>
                    <div class="vernier-chapter">
                      <media-slider-track class="vernier-track">
                        <media-slider-buffer class="vernier-buffer-bar"></media-slider-buffer>
                        <media-slider-fill class="vernier-fill"></media-slider-fill>
                      </media-slider-track>
                    </div>
                  </template>
                </media-time-slider-chapters>
                <media-slider-thumb class="vernier-thumb"></media-slider-thumb>
                <media-slider-preview class="vernier-loupe">
                  <media-slider-thumbnail class="vernier-loupe-thumb"></media-slider-thumbnail>
                  <div class="vernier-loupe-meta">
                    <media-time-slider-chapter-title class="vernier-loupe-chapter"></media-time-slider-chapter-title>
                    <media-slider-value class="vernier-loupe-val" type="pointer">0:00</media-slider-value>
                  </div>
                </media-slider-preview>
              </media-time-slider>
            </div>

            <!-- Anodized Transport Controls Row -->
            <media-controls-group class="vernier-controls-row">
              <div class="vernier-cluster">
                <media-play-button class="v-ctrl vernier-play" commandfor="tt-play" aria-label="Play" data-paused>
                  <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                    <polygon points="7,5 19,12 7,19" fill="currentColor" stroke="none"></polygon>
                  </svg>
                  <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect>
                    <rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect>
                  </svg>
                  <svg class="icon-replay" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                    <path d="M3 3v5h5"></path>
                  </svg>
                </media-play-button>
                <media-tooltip id="tt-play" class="vernier-tooltip" side="top" boundary="container">Play / Pause (K)</media-tooltip>

                <media-seek-button class="v-ctrl vernier-seek-btn" seconds="-10" commandfor="tt-back" aria-label="Seek back 10 seconds">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 17l-5-5 5-5"></path>
                    <path d="M18 17l-5-5 5-5"></path>
                  </svg>
                  <span class="v-seek-tag" aria-hidden="true">10</span>
                </media-seek-button>
                <media-tooltip id="tt-back" class="vernier-tooltip" side="top" boundary="container">Back 10s (J)</media-tooltip>

                <media-seek-button class="v-ctrl vernier-seek-btn" seconds="10" commandfor="tt-fwd" aria-label="Seek forward 10 seconds">
                  <span class="v-seek-tag" aria-hidden="true">10</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13 17l5-5-5-5"></path>
                    <path d="M6 17l5-5-5-5"></path>
                  </svg>
                </media-seek-button>
                <media-tooltip id="tt-fwd" class="vernier-tooltip" side="top" boundary="container">Forward 10s (L)</media-tooltip>

                <div class="vernier-volume-group">
                  <media-mute-button class="v-ctrl vernier-mute" commandfor="tt-mute" aria-label="Mute">
                    <svg class="icon-vol-high" viewBox="0 0 24 24" aria-hidden="true">
                      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg class="icon-vol-low" viewBox="0 0 24 24" aria-hidden="true">
                      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                      <line x1="22" y1="9" x2="16" y2="15"></line>
                      <line x1="16" y1="9" x2="22" y2="15"></line>
                    </svg>
                  </media-mute-button>
                  <media-tooltip id="tt-mute" class="vernier-tooltip" side="top" boundary="container">Mute (M)</media-tooltip>

                  <media-volume-slider
                    class="vernier-vol-slider"
                    aria-label="Volume"
                    tabindex="0"
                    role="slider"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="100"
                  >
                    <media-slider-track class="vernier-vol-track">
                      <media-slider-fill class="vernier-vol-fill"></media-slider-fill>
                    </media-slider-track>
                    <media-slider-thumb class="vernier-vol-thumb"></media-slider-thumb>
                  </media-volume-slider>
                </div>

                <media-time-group class="vernier-time-group" aria-label="Time progress">
                  <media-time class="vernier-time-toggle" type="current" toggle title="Click to toggle elapsed / remaining time"></media-time>
                  <media-time-separator class="vernier-sep">/</media-time-separator>
                  <media-time class="vernier-time-duration" type="duration"></media-time>
                </media-time-group>
              </div>

              <div class="vernier-cluster">
                <div class="vernier-speed-wrap">
                  <media-playback-rate-button
                    class="v-ctrl vernier-rate"
                    commandfor="vernier-speed-menu"
                    aria-label="Playback speed"
                    data-rate="1"
                  ></media-playback-rate-button>
                  <media-menu id="vernier-speed-menu" class="vernier-menu" side="top" align="end" boundary="container">
                    <media-menu-content class="vernier-menu-content">
                      <media-playback-rate-radio-group aria-label="Playback speed">
                        <template>
                          <media-menu-radio-item class="vernier-menu-item">
                            <span data-part="label"></span>
                            <media-menu-item-indicator></media-menu-item-indicator>
                          </media-menu-radio-item>
                        </template>
                      </media-playback-rate-radio-group>
                    </media-menu-content>
                  </media-menu>
                </div>

                <media-captions-button class="v-ctrl vernier-cc" commandfor="tt-cc" aria-label="Toggle captions">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
                    <path d="M10 10.2a2.2 2.2 0 1 0 0 3.6"></path>
                    <path d="M16.5 10.2a2.2 2.2 0 1 0 0 3.6"></path>
                  </svg>
                  <span class="vernier-cc-bar" aria-hidden="true"></span>
                </media-captions-button>
                <media-tooltip id="tt-cc" class="vernier-tooltip" side="top" boundary="container">Captions (C)</media-tooltip>

                <media-pip-button class="v-ctrl vernier-pip" commandfor="tt-pip" aria-label="Picture in Picture">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect>
                    <rect x="11.5" y="11" width="7.5" height="5.5" rx="1" fill="currentColor" stroke="none"></rect>
                  </svg>
                </media-pip-button>
                <media-tooltip id="tt-pip" class="vernier-tooltip" side="top" boundary="container">Picture in Picture</media-tooltip>

                <media-fullscreen-button class="v-ctrl vernier-fs" commandfor="tt-fs" aria-label="Fullscreen">
                  <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
                    <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                  </svg>
                  <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 9h4V5"></path>
                    <path d="M20 9h-4V5"></path>
                    <path d="M4 15h4v4"></path>
                    <path d="M20 15h-4v4"></path>
                  </svg>
                </media-fullscreen-button>
                <media-tooltip id="tt-fs" class="vernier-tooltip" side="top" boundary="container">Fullscreen (F)</media-tooltip>
              </div>
            </media-controls-group>
          </div>
        </media-tooltip-group>
      </media-controls-content>
    </media-controls>

    <!-- Accessible Playback Error Recovery Dialog -->
    <media-error-dialog>
      <media-dialog-backdrop class="vernier-dialog-backdrop"></media-dialog-backdrop>
      <media-dialog-popup class="vernier-dialog-popup">
        <media-dialog-title class="vernier-dialog-title">Playback Signal Interrupted</media-dialog-title>
        <media-dialog-description class="vernier-dialog-desc"></media-dialog-description>
        <media-dialog-close class="vernier-dialog-close">Dismiss</media-dialog-close>
      </media-dialog-popup>
    </media-error-dialog>
  </media-container>
</video-player>
